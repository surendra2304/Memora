[alembic]
# This package-local config keeps the migration runner usable from an installed
# wheel. `%(here)s` resolves to the installed migrations directory.
script_location = %(here)s
prepend_sys_path = %(here)s/..
path_separator = os
timezone = UTC
truncate_slug_length = 40
sqlalchemy.url = sqlite:///./data/memora.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
