name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    name: Build, Lint, Test & Containerize
    runs-on: ubuntu-latest
    env:
      # Oracle Autonomous Database DSN. Database-backed steps below are
      # skipped when this secret is not configured; CI never provisions
      # PostgreSQL or SQLite.
      MEMORA_ORACLE_DSN: ${{ secrets.MEMORA_ORACLE_DSN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff>=0.3.0"

      - name: Lint (Ruff)
        run: ruff check .

      - name: Verify Alembic Migrations
        if: env.MEMORA_ORACLE_DSN != ''
        env:
          DATABASE_URL: ${{ secrets.MEMORA_ORACLE_DSN }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run Test Suite (Pytest)
        # The suite imports storage.relational.session, which builds an engine
        # at import time, so it requires a reachable Oracle DSN. The
        # PostgreSQL-only storage-authority test self-skips without
        # MEMORA_TEST_POSTGRES_URL. The former boot/health step asserted
        # SQLite storage and is not applicable to Oracle.
        if: env.MEMORA_ORACLE_DSN != ''
        env:
          DATABASE_URL: ${{ secrets.MEMORA_ORACLE_DSN }}
        run: |
          pytest -q

      - name: Verify Docker Container Build
        run: |
          docker build -t memora .
