name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    name: Build, Migrate, Test & Containerize
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: memora_test
          POSTGRES_PASSWORD: memora_test
          POSTGRES_DB: memora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memora_test -d memora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff>=0.3.0"

      - name: Lint (Ruff)
        run: ruff check .

      - name: Verify Alembic Migrations
        env:
          DATABASE_URL: sqlite:///./data/ci_migrations.db
          SQLITE_FALLBACK_URL: sqlite:///./data/ci_migrations.db
        run: |
          mkdir -p data
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run Test Suite (Pytest)
        env:
          DATABASE_URL: sqlite:///./data/ci_memora.db
          SQLITE_FALLBACK_URL: sqlite:///./data/ci_memora.db
        run: |
          mkdir -p data
          pytest -q

      - name: Run PostgreSQL 18 production-storage integration test
        env:
          MEMORA_TEST_POSTGRES_URL: postgresql+psycopg2://memora_test:memora_test@localhost:5432/memora_test
        run: |
          pytest -q tests/test_storage_authority.py::test_production_postgres_engine_is_authoritative

      - name: Verify Application Boot & Health Contract
        env:
          DATABASE_URL: sqlite:///./data/ci_boot.db
          SQLITE_FALLBACK_URL: sqlite:///./data/ci_boot.db
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from apps.api.main import app

          with TestClient(app) as client:
              r = client.get('/health')
              assert r.status_code == 200, r.text
              body = r.json()
              assert body['service'] == 'memora', body
              assert body['status'] in ['ok', 'healthy'], body
              assert body['evidence_class'] == 'process_liveness', body
              assert body['storage'] == 'sqlite_wal', body

              r_ready = client.get('/ready')
              assert r_ready.status_code == 200, r_ready.text
              ready_body = r_ready.json()
              assert ready_body['status'] == 'ready', ready_body

              r_metrics = client.get('/v1/metrics')
              assert r_metrics.status_code == 200, r_metrics.text
              print('CI health, readiness & telemetry contracts verified.')
          "

      - name: Verify Docker Container Build
        run: |
          docker build -t memora .
