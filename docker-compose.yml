services:
  memora-api:
    build: .
    container_name: memora-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg2://memora_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/memora_db"
      USE_SQLITE_FALLBACK: "false"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "memora_embeddings"
      MEMORA_ENV: "production"
      MEMORA_ALLOW_ANONYMOUS_DEV: "false"
      MEMORA_API_KEY: "${MEMORA_API_KEY:?Set MEMORA_API_KEY in .env}"
      FRIDAY_API_KEY: "${FRIDAY_API_KEY:-}"
      INFERENCE_API_KEY: "${INFERENCE_API_KEY:-}"
      STRATEX_API_KEY: "${STRATEX_API_KEY:-}"
      INTELX_API_KEY: "${INTELX_API_KEY:-}"
      FUTURIS_API_KEY: "${FUTURIS_API_KEY:-}"
      CORTEX_API_KEY: "${CORTEX_API_KEY:-}"
      FORGE_API_KEY: "${FORGE_API_KEY:-}"
      SENTINEL_API_KEY: "${SENTINEL_API_KEY:-}"
      AI_UNIVERSE_API_KEY: "${AI_UNIVERSE_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: memora-postgres
    environment:
      POSTGRES_USER: "memora_user"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "memora_db"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora_user -d memora_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: memora-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: memora-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
