services:
  - type: web
    name: friday-memora
    env: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: MEMORA_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SQLITE_FALLBACK_URL
        sync: false
