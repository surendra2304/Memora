services:
  - type: web
    name: memora
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: MEMORA_ENV
        value: "production"
      # Production must use persistent managed storage. Configure DATABASE_URL
      # (or both TURSO variables) in Render; do not silently start on local SQLite.
      - key: DATABASE_URL
        sync: false
      - key: USE_SQLITE_FALLBACK
        value: "false"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      # Configure a reachable Qdrant service; localhost is not the deployed API.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_COLLECTION
        value: "memora_embeddings"
      - key: MEMORA_ALLOW_ANONYMOUS_DEV
        value: "false"
      - key: MEMORA_API_KEY
        sync: false
      # Live Mesh Interconnects
      - key: FRIDAY_URL
        value: "https://friday-zw59.onrender.com"
      - key: FRIDAY_API_KEY
        sync: false
      - key: INFERENCE_URL
        value: "https://inference-h7bn.onrender.com"
      - key: INFERENCE_API_KEY
        sync: false
      - key: STRATEX_URL
        value: "https://stratex-8wj1.onrender.com"
      - key: STRATEX_API_KEY
        sync: false
      - key: INTELX_URL
        value: "https://intelx-mygl.onrender.com"
      - key: INTELX_API_KEY
        sync: false
      - key: FUTURIS_URL
        value: "https://futuris-th6f.onrender.com"
      - key: FUTURIS_API_KEY
        sync: false
      - key: CORTEX_URL
        value: "https://cortex-0m7c.onrender.com"
      - key: CORTEX_API_KEY
        sync: false
      - key: FORGE_URL
        value: "https://forge-e9kl.onrender.com"
      - key: FORGE_API_KEY
        sync: false
      - key: SENTINEL_URL
        value: "https://sentinel-a861.onrender.com"
      - key: SENTINEL_API_KEY
        sync: false
      - key: AI_UNIVERSE_API_KEY
        sync: false
